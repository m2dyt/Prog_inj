name: supermarket-lab2
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supermarket_env
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.sh first}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes: ["db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supermarket_env"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]
    restart: unless-stopped
  api:
    build: ./scaffold-api
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
    restart: unless-stopped
  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./scaffold-web:/usr/share/nginx/html:ro
    ports: ["127.0.0.1:${HTTP_PORT:-8082}:80"]
    depends_on:
      api: {condition: service_healthy}
    networks: [internal]
    restart: unless-stopped
volumes:
  db_data:
networks:
  internal:
